name: Deploy to Firebase Hosting

# Deploy from GitHub: every push to main builds the Next.js app and deploys it
# (plus Firestore + Storage rules) to Firebase Hosting.
#
# Required GitHub setup (see nextjs_space/DEPLOY.md):
#   Variables: FIREBASE_PROJECT_ID
#   Secrets:   FIREBASE_SERVICE_ACCOUNT  (service-account JSON, one line NOT required — stored as file)
#              NEXT_PUBLIC_FIREBASE_API_KEY, NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,
#              NEXT_PUBLIC_FIREBASE_PROJECT_ID, NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,
#              NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID, NEXT_PUBLIC_FIREBASE_APP_ID
#              (optional: NEXT_PUBLIC_FIREBASE_DATABASE_URL, NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs_space
    env:
      # Baked into the client bundle at build time — needed both for the
      # explicit build step AND for the framework build `firebase deploy` runs.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Static-output builds are blocked on purpose: dynamic routes are
      # runtime-created (see DEPLOY.md) and need the SSR backend.
      - name: Build
        run: npm run build

      - name: Write service-account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/gcloud-service-account.json"

      - name: Deploy hosting + rules
        run: >
          npx -y firebase-tools@latest deploy
          --only hosting,firestore,storage
          --project "${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}"
          --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-service-account.json

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcloud-service-account.json"
