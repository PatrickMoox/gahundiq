# Builds the Gahundiq image with NEXT_PUBLIC_* Firebase config baked in
# (supplied as user-defined substitutions by scripts/gcp-deploy.sh, which
# reads them from the uncommitted .env.local), pushes to Artifact Registry,
# and registers the image for `gcloud run deploy --image`.
#
# Manual equivalent:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions _API_KEY=…,_AUTH_DOMAIN=…,_REGION=us-central1,_TAG=dev1 .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${_API_KEY} \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_AUTH_DOMAIN} \
          --build-arg NEXT_PUBLIC_FIREBASE_DATABASE_URL=${_DB_URL} \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_PROJECT_ID} \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_STORAGE_BUCKET} \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_SENDER_ID} \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${_APP_ID} \
          --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_MEASUREMENT_ID} \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/gahundiq/app:${_TAG}" \
          -f Dockerfile .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/gahundiq/app:${_TAG}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/gahundiq/app:${_TAG}'
